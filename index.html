<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles/style.css">
</head>

<body>
    <div class="media">
        <header>
            <nav class="nav">
                <div class="container">
                    <div class="logo">
                        <img src="images/log.png" alt="" class="logo-img">
                        <div class="logo_text">
                            <h3 class="logo-title">REACT SNEAKERS</h3>
                            <p class="logo-text">Магазин лучших кроссовок</p>
                        </div>
                    </div>
                    <div class="nav_buttons">
                        <button class="basket-btn">
                            <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32"
                                viewBox="0 0 24 24"><!-- Icon from Boxicons by Boxicons - https://github.com/box-icons/boxicons-core/blob/main/LICENSE -->
                                <path fill="currentColor"
                                    d="M21 6H7.05L5.94 2.68A1 1 0 0 0 4.99 2h-3v2h2.28l3.54 10.63A2 2 0 0 0 9.71 16h7.59a2 2 0 0 0 1.87-1.3l2.76-7.35c.11-.31.07-.65-.11-.92A1 1 0 0 0 21 6m-3.69 8H9.72l-2-6h11.84zM10 18a2 2 0 1 0 0 4a2 2 0 1 0 0-4m7 0a2 2 0 1 0 0 4a2 2 0 1 0 0-4" />
                            </svg>
                            <span class="basket-span">1205 руб.</span>
                        </button>
                        <button class="favourite-btn">
                            <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32"
                                viewBox="0 0 24 24"><!-- Icon from Material Symbols by Google - https://github.com/google/material-design-icons/blob/master/LICENSE -->
                                <path fill="currentColor"
                                    d="M11.288 20.2q-.363-.125-.638-.4l-1.725-1.575q-2.65-2.425-4.787-4.812T2 8.15Q2 5.8 3.575 4.225T7.5 2.65q1.325 0 2.5.562t2 1.538q.825-.975 2-1.537t2.5-.563q2.35 0 3.925 1.575T22 8.15q0 2.875-2.125 5.275T15.05 18.25l-1.7 1.55q-.275.275-.637.4t-.713.125t-.712-.125M11.05 6.75q-.725-1.025-1.55-1.562t-2-.538q-1.5 0-2.5 1t-1 2.5q0 1.3.925 2.763t2.213 2.837t2.65 2.575T12 18.3q.85-.775 2.213-1.975t2.65-2.575t2.212-2.837T20 8.15q0-1.5-1-2.5t-2.5-1q-1.175 0-2 .538T12.95 6.75q-.175.25-.425.375T12 7.25t-.525-.125t-.425-.375m.95 4.725" />
                            </svg>
                        </button>
                        <button class="user-btn">
                            <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32"
                                viewBox="0 0 24 24"><!-- Icon from Tabler Icons by Paweł Kuna - https://github.com/tabler/tabler-icons/blob/master/LICENSE -->
                                <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"
                                    stroke-width="2">
                                    <path d="M3 12a9 9 0 1 0 18 0a9 9 0 1 0-18 0" />
                                    <path
                                        d="M9 10a3 3 0 1 0 6 0a3 3 0 1 0-6 0m-2.832 8.849A4 4 0 0 1 10 16h4a4 4 0 0 1 3.834 2.855" />
                                </g>
                            </svg>
                        </button>
                    </div>
                </div>
            </nav>
            <section class="header_section">
                <div class="container">
                    <img class="header-img" src="images/disney.png" alt="">
                    <div class="header__left">
                        <h1 class="header__left-title">Stan Smith<span>, Forever!</span></h1>
                        <button class="header__left-btn">See more</button>
                    </div>
                    <img src="images/header.png" alt="">
                </div>
            </section>
        </header>
        <main>
            <div class="container">
                <div class="main_top">
                    <h1 class="main-title">Все кроссовки</h1>
                    <input type="text" placeholder="Поиск..." class="main-input">
                </div>
                <div class="products">
                    <div class="product">
                        
                    </div>
                </div>
            </div>
        </main>
    </div>
</body>

</html>
